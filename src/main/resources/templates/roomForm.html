<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Skapa rum</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Skapa rum</h1>

    <p th:if="${error}" th:text="${error}" style="color: red;"></p>
    <p th:if="${success}" th:text="${success}" style="color: green;"></p>

    <form method="POST" action="/rooms/new">

        <div class="form-group mb-2">
            <label>Rumsnummer</label>
            <input type="text" name="roomNumber" class="form-control" required/>
        </div>

        <div class="form-group mb-2">
            <label>Rumstyp</label>
            <select name="roomType" class="form-control">
                <option th:each="type : ${roomTypes}"
                        th:value="${type}"
                        th:text="${type}">
                </option>
            </select>
        </div>

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Skapa rum</button>
            <a href="/rooms" class="btn btn-secondary">Tillbaka</a>
            <a href="/index" class="btn btn-secondary">Hem</a>
        </div>
    </form>
</div>
</body>
</html>
