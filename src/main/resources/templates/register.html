<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registrera kund</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<p th:if="${error}" th:text ="${error}" style ="color : red"></p>
<div class="container mt-4">
    <h1 class="text-center">Registrera kund</h1>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>
    <form method="POST" action="/register">
        <div class="form-group mb-2">
            <label for="firstName">Förnamn</label>
            <input type="text" name="firstName" id="firstName" class="form-control">
        </div>
        <div class="form-group mb-2">
            <label for="lastName">Efternamn</label>
            <input type="text" name="lastName" id="lastName" class="form-control">
        </div>
        <div class="form-group mb-2">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" class="form-control">
        </div>
        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Registrera kund</button>
            <a href="/allcustomers" class="btn btn-secondary">Tillbaka</a>
            <a href="/index" class="btn btn-secondary">Hem</a>
        </div>
    </form>
</div>
</body>
</html>
