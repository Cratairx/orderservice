<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <h1>Registrera en bokning</h1>

  <!-- Felmeddelande om rummet är upptaget -->
  <p th:if="${error}" th:text="${error}" style="color: red;"></p>
  <!-- Bekräftelse om bokningen lyckades -->
  <p th:if="${success}" th:text="${success}" style="color: green;"></p>

  <!-- Action pekar på /bookings/new istället för /booking -->
  <form method="POST" action="/bookings/new">

    <!-- Dropdown med kunder istället för fritext-id -->
    <div class="form-group">
      <label>Kund</label>
      <select name="customerId" class="form-control">
        <option th:each="customer : ${customers}"
                th:value="${customer.id}"
                th:text="${customer.firstName + ' ' + customer.lastName}">
        </option>
      </select>
    </div>

    <!-- Dropdown med rum -->
    <div class="form-group">
      <label>Rum</label>
      <select name="roomId" class="form-control">
        <option th:each="room : ${rooms}"
                th:value="${room.id}"
                th:text="${room.roomNumber + ' (' + room.roomType + ')'}">
        </option>
      </select>
    </div>

    <!-- Datumfält -->
    <div class="form-group">
      <label>Incheckning</label>
      <input type="date" name="startDate" class="form-control" required/>
    </div>

    <div class="form-group">
      <label>Utcheckning</label>
      <input type="date" name="endDate" class="form-control" required/>
    </div>

    <button type="submit" class="btn btn-primary mt-2">Registrera bokning</button>
  </form>
</div>
</body>
</html>
