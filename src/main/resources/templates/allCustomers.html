<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center">Alla kunder</h2>

    <p th:if="${error}" th:text="${error}" style="color: red"></p>

    <div class="text-center mt-2">
        <a href="/register" class="btn btn-primary btn-sm">Registrera kund</a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Förnamn</th>
            <th>Efternamn</th>
            <th>Email</th>
            <th>Ändra</th>
            <th>Ta bort</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.id}"></td>
            <td th:text="${customer.firstName}"></td>
            <td th:text="${customer.lastName}"></td>
            <td th:text="${customer.email}"></td>
            <td>
                <a th:href="@{/editcustomer/{id}(id=${customer.id})}" class="btn btn-primary btn-sm">Ändra</a>
            </td>
            <td>
                <a th:href="@{/deletecustomer/{id}(id=${customer.id})}" class="btn btn-danger btn-sm">Ta bort</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center mt-2">
        <a href="/index" class="btn btn-secondary btn-sm">Hem</a>
    </div>
</div>
</body>
</html>
