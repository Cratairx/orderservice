<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Rooms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Search Available Rooms</h2>

    <form method="get" action="bookings/available" class="row g-3 mb-4">
        <div class="col-auto">
            <label for="startDate">From</label>
            <input type="date" id="startDate" name="startDate" class="form-control"
                   th:value="${startDate}" required/>
        </div>
        <div class="col-auto">
            <label for="endDate">To</label>
            <input type="date" id="endDate" name="endDate" class="form-control"
                   th:value="${endDate}" required/>
        </div>
        <div class="col-auto align-self-end">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <p th:if="${error}" th:text="${error}" style="color: red"></p>

    <div th:if="${rooms}">
        <h4>Available Rooms</h4>
        <p th:if="${#lists.isEmpty(rooms)}">No rooms available for this period.</p>
        <table class="table" th:unless="${#lists.isEmpty(rooms)}">
            <thead>
            <tr>
                <th>Room Number</th>
                <th>Type</th>
                <th>Book</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="room : ${rooms}">
                <td th:text="${room.roomNumber}"></td>
                <td th:text="${room.roomType}"></td>
                <td>
                    <a th:href="@{/bookings/new(roomId=${room.id},startDate=${startDate},endDate=${endDate})}"
                       class="btn btn-success btn-sm">Book</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
