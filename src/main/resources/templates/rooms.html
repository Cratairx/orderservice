<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rum</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Alla rum</h1>

    <p th:if="${error}" th:text="${error}" style="color: red;"></p>
    <p th:if="${success}" th:text="${success}" style="color: green;"></p>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Rumsnummer</th>
            <th>Typ</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.id}"></td>
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.roomType}"></td>
            <td>
                <!-- Formulär används istället för länk eftersom delete kräver POST -->
                <form th:action="@{/rooms/delete/{id}(id=${room.id})}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">Ta bort</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/rooms/new" class="btn btn-primary">Skapa nytt rum</a>
</div>
</body>
</html>
