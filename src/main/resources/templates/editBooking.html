<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redigera bokning</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h1 class="text-center">Redigera bokning</h1>

    <p th:if="${error}" th:text="${error}" style="color: red;"></p>
    <p th:if="${success}" th:text="${success}" style="color: green;"></p>

    <form method="POST" th:action="@{/bookings/editbooking}" th:object="${bookingForm}">

        <input type="hidden" th:field="*{id}">

        <div class="form-group mb-2">
            <label>Kund</label>
            <select th:field="*{customerId}" class="form-control">
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.firstName + ' ' + customer.lastName}">
                </option>
            </select>
        </div>

        <div class="form-group mb-2">
            <label>Rum</label>
            <select th:field="*{roomId}" class="form-control">
                <option th:each="room : ${rooms}"
                        th:value="${room.id}"
                        th:text="${room.roomNumber + ' (' + room.roomType + ')'}">
                </option>
            </select>
        </div>

        <div class="form-group mb-2">
            <label>Incheckning</label>
            <input type="date" th:field="*{startDate}" class="form-control" required/>
        </div>

        <div class="form-group mb-2">
            <label>Utcheckning</label>
            <input type="date" th:field="*{endDate}" class="form-control" required/>
        </div>

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Spara ändringar</button>
            <a href="/bookings" class="btn btn-secondary">Tillbaka</a>
            <a href="/index" class="btn btn-secondary">Hem</a>
        </div>
    </form>
</div>
</body>
</html>
