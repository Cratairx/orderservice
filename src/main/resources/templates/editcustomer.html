<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Redigera kund</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Redigera kundens uppgifter</h1>
    <form method="POST" action="/editcustomer">
        <input type="hidden" name="id" th:value="${customer.id}">
        <div class="form-group mb-2">
            <label>First name</label>
            <input type="text" name="firstName" th:value="${customer.firstName}" class="form-control">
        </div>
        <div class="form-group mb-2">
            <label>Last name</label>
            <input type="text" name="lastName" th:value="${customer.lastName}" class="form-control">
        </div>
        <div class="form-group mb-2">
            <label>Email</label>
            <input type="text" name="email" th:value="${customer.email}" class="form-control">
        </div>
        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Spara</button>
            <a href="/allcustomers" class="btn btn-secondary">Back</a>
            <a href="/index" class="btn btn-secondary">Home</a>
        </div>
    </form>
</div>
</body>
</html>
