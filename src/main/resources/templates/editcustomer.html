<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Redigera kund</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<form method="POST" action="/editcustomer">
    <p>Redigera kundens uppgifter</p>
    <input type ="hidden" name ="id" th:value="${customer.id}">
    <div class = "form-group">
        <input type ="text" name = "firstName" th:value="${customer.firstName}">
    </div>
    <div class = form-group>
        <input type ="text" name = "lastName" th:value="${customer.lastName}">
    </div>
    <div class = form-group>
        <input type ="text" name = "email" th:value="${customer.email}">
    </div>
    <button type = "submit">Spara</button>

</form>

</body>
</html>
