<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redigera rum</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Redigera rum</h1>

    <p th:if="${error}" th:text="${error}" style="color: red;"></p>
    <p th:if="${success}" th:text="${success}" style="color: green;"></p>

    <form method="POST" th:action="@{/rooms/editroom/{id}(id=${room.id})}">

        <div class="form-group mb-2">
            <label>Rumsnummer</label>
            <input type="text" name="roomNumber" class="form-control"
                   th:value="${room.roomNumber}" required/>
        </div>

        <div class="form-group mb-2">
            <label>Rumstyp</label>
            <select name="roomType" class="form-control">
                <option th:each="type : ${roomTypes}"
                        th:value="${type}"
                        th:text="${type}"
                        th:selected="${type == room.roomType}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mt-2">Spara ändringar</button>
    </form>

    <a href="/rooms" class="btn btn-secondary mt-2">Visa alla rum</a>
</div>
</body>
</html>
