<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bokningar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center">Alla bokningar</h2>

    <p th:if="${success}" th:text="${error}" style="color: green;"></p>
    <p th:if="${error}" th:text="${error}" style="color: red"></p>

    <div class="text-center mt-2 mb-3">
        <a href="/bookings/available" class="btn btn-primary btn-sm">Ny bokning</a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Kund</th>
            <th>Rum</th>
            <th>Incheckning</th>
            <th>Utcheckning</th>
            <th>Ändra</th>
            <th>Ta bort</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
            <td th:text="${booking.id}"></td>
            <td th:text="${booking.customer.firstName + ' ' + booking.customer.lastName}"></td>
            <td th:text="${booking.room.roomNumber + ' (' + booking.room.roomType + ')'}"></td>
            <td th:text="${booking.startDate}"></td>
            <td th:text="${booking.endDate}"></td>
            <td>
                <a th:href="@{/bookings/editbooking/{id}(id=${booking.id})}"
                   class="btn btn-primary btn-sm">Ändra</a>

            </td>
            <td>
                <form method="post" th:action="@{/bookings/deletebooking/{id}(id=${booking.id})}">
                    <button type="submit" class="btn btn-danger btn-sm">Ta bort</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center mt-2">
        <a href="/index" class="btn btn-secondary btn-sm">Hem</a>
    </div>
</div>
</body>
</html>
